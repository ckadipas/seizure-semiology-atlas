name: "📄 Submit a paper for intake"
description: Upload a PDF or page images, or share a DOI or link for source review.
title: "[intake] "
labels: ["intake"]
body:
  - type: markdown
    attributes:
      value: |
        Share one paper by uploading its PDF or page images in the field below,
        or by pasting its DOI or a stable link. You do not need to extract
        findings, classify the study, or complete bibliographic fields.

        This issue and its attachments are public. Upload files you have
        permission to share publicly.
  - type: textarea
    id: doi
    attributes:
      label: Paper PDF, page images, DOI, or link
      description: Drag files into this field or use its attachment button. A DOI or stable link is also sufficient.
      placeholder: "Drop a PDF or page images here, or paste a DOI or link."
    validations: { required: true }
  - type: textarea
    id: relevance
    attributes:
      label: Note (optional)
      description: Add anything that may help the maintainers review this paper.
