name: "📄 Submit a paper for intake"
description: Share a DOI, link, or attachment for private source review.
title: "[intake] "
labels: ["intake"]
body:
  - type: markdown
    attributes:
      value: |
        Share one paper. Paste its DOI or a stable link below, or drag an
        attachment into the same field. You do not need to extract findings,
        classify the study, or complete bibliographic fields.

        Prefer a DOI or publisher link for copyrighted articles. Attach a file
        only when you have permission to share it in a public GitHub issue.
  - type: textarea
    id: doi
    attributes:
      label: Paper DOI, link, or attachment
      description: Paste one DOI or stable link, or drag the paper or page images here.
      placeholder: "https://doi.org/10.…"
    validations: { required: true }
  - type: textarea
    id: relevance
    attributes:
      label: Note (optional)
      description: Add anything that may help the maintainers review this paper.
