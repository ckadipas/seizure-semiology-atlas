name: "📄 Submit a paper for intake"
description: Share a DOI or stable link for private source review.
title: "[intake] "
labels: ["intake"]
body:
  - type: markdown
    attributes:
      value: |
        Share one paper by pasting its DOI or a stable publisher or repository
        link below. You do not need to extract findings, classify the study,
        or complete bibliographic fields.

        This issue is public. Keep source PDFs, page photographs, full article
        text, and private information out of it. Source files are handled
        through the private review process.
  - type: textarea
    id: doi
    attributes:
      label: Paper DOI or stable link
      description: Paste one DOI or stable publisher or repository link.
      placeholder: "https://doi.org/10.…"
    validations: { required: true }
  - type: textarea
    id: relevance
    attributes:
      label: Note (optional)
      description: Add anything that may help the maintainers review this paper.
