name: Paper intake — Gate A registration only

# Safety boundary: this workflow never downloads source files, invokes a model,
# edits repository content, creates a branch/PR, or publishes scientific output.
# It only records that the owner has approved moving an intake request into the
# private evidence-review workflow defined in ckadipas/semiology_refs/AGENTS.md.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to register for private Gate A preparation
        required: true

permissions:
  contents: read
  issues: write

concurrency:
  group: intake-register-${{ github.event.inputs.issue_number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  register:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'approved')
    runs-on: ubuntu-latest
    steps:
      - name: Post private-review gate instructions
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.eventName === 'workflow_dispatch'
              ? Number(context.payload.inputs.issue_number)
              : context.payload.issue.number;

            const body = [
              'The intake request has been registered for **private Gate A preparation**.',
              '',
              'Direct model extraction and repository publishing are disabled. Before any source review begins, the owner must approve a private Gate A record that binds the exact source SHA-256, the frozen review release, representations, and invocation budget in ckadipas/semiology_refs.',
              '',
              'All source files, extracted text, model outputs, review rows, and audit artifacts remain in the private evidence repository. This public workflow does not download or inspect attachments and made no scientific or repository-content change.',
              '',
              'After private review, an exact owner packet and separate Gate B approval are required before any deterministic integration. Deployment is separately authorized.'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body
            });
