name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate public operational guidance
        run: python3 tools/test_public_governance.py
      - name: Validate generated atlas bundle
        run: python3 tools/validate_atlas_bundle.py
      - name: Validate clinical hierarchy and compact display
        run: python3 tools/test_compact_renderer.py
      - name: Build website
        run: python3 generator/gen_study.py
