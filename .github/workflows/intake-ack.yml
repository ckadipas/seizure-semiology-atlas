name: Intake acknowledgement

# When a paper-intake issue is opened, post a short receipt so the maintainer
# and submitter know the next step. An
# "approved" label registers the request for private Gate A preparation. This
# workflow only comments and is safe to run on every qualifying opened issue.

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  ack:
    # The issue form applies this label to DOI-, link-, and attachment-based submissions.
    if: contains(github.event.issue.labels.*.name, 'intake')
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "Thanks — your submission has been received. A maintainer's approval registers it for private Gate A preparation. The source and scientific data are not added to this public repository until private review, owner adjudication, exact integration approval, and separately authorized deployment are complete."
