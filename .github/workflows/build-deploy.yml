name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate public operational guidance
        run: python3 tools/test_public_governance.py
      - name: Validate generated atlas bundle
        run: python3 tools/validate_atlas_bundle.py
      - name: Validate clinical hierarchy and compact display
        run: python3 tools/test_compact_renderer.py
      - name: Build website
        run: python3 generator/gen_study.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild the published release deterministically
        run: |
          python3 tools/validate_atlas_bundle.py
          python3 generator/gen_study.py
      - name: Verify published site matches the generated release byte-for-byte
        run: |
          url="https://ckadipas.github.io/seizure-semiology-atlas/"
          expected=$(sha256sum docs/index.html | awk '{print $1}')
          for attempt in $(seq 1 20); do
            code=$(curl -sS -L -o live-index.html -w '%{http_code}' "$url?release=${GITHUB_SHA}" || true)
            actual=$(sha256sum live-index.html 2>/dev/null | awk '{print $1}')
            if [ "$code" = "200" ] && [ "$actual" = "$expected" ]; then
              echo "Live release hash matches generated index: $actual"
              exit 0
            fi
            echo "attempt $attempt: HTTP $code expected=$expected actual=$actual"
            sleep 15
          done
          exit 1
