name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate public operational guidance
        run: python3 tools/test_public_governance.py
      - name: Validate generated atlas bundle
        run: python3 tools/validate_atlas_bundle.py
      - name: Build website
        run: python3 generator/gen_study.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify published site
        run: |
          url="https://ckadipas.github.io/seizure-semiology-atlas/"
          for attempt in $(seq 1 10); do
            code=$(curl -s -o body.html -w '%{http_code}' "$url" || true)
            if [ "$code" = "200" ] && grep -qi "Seizure Semiology" body.html; then
              echo "Live OK"
              exit 0
            fi
            echo "attempt $attempt: HTTP $code"
            sleep 15
          done
          exit 1
